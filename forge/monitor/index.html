<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>forge · progress</title>
<link rel="icon" id="fav" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2016%2016%22%3E%3Crect%20x%3D%221%22%20y%3D%229%22%20width%3D%223.6%22%20height%3D%226%22%20rx%3D%221%22%20fill%3D%22%239ece6a%22%20opacity%3D%22.55%22/%3E%3Crect%20x%3D%226.2%22%20y%3D%225%22%20width%3D%223.6%22%20height%3D%2210%22%20rx%3D%221%22%20fill%3D%22%239ece6a%22/%3E%3Crect%20x%3D%2211.4%22%20y%3D%221.5%22%20width%3D%223.6%22%20height%3D%2213.5%22%20rx%3D%221%22%20fill%3D%22%239ece6a%22%20opacity%3D%22.8%22/%3E%3C/svg%3E">
<style>body{margin:0;background:#14161a;color:#d8dee9}</style>
</head>
<body>
<header>
  <span class="brand">forge</span>
  <span id="now" class="dim"></span>
  <span id="status" class="dim"></span>
  <button type="button" id="order" class="order"></button>
</header>
<div id="waiting" hidden></div>
<main>
  <aside id="tasks"><div class="empty">loading…</div></aside>
  <section class="right">
    <div id="nowbar" hidden></div>
    <div id="ctx" hidden></div>
    <div id="timeline"><div class="empty">pick a task on the left</div></div>
  </section>
</main>
<script>
// Styles and script load past the cache: the tab lives for days, the plugin
// updates under it, and an old app.js quietly asks for files of the old layout.
(function () {
  var v = '?v=' + Date.now();
  var css = document.createElement('link');
  css.rel = 'stylesheet'; css.href = 'style.css' + v;
  document.head.appendChild(css);
  var js = document.createElement('script');
  js.src = 'app.js' + v;
  document.body.appendChild(js);
})();
</script>
</body>
</html>
